name: CI

# Every push and pull request: the same vet, tests and cross-compiles the
# release runs, so a break shows up before a tag does.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test ./...

  build:
    # The app must compile for every platform a release ships, which a Linux
    # runner can check without a Mac or a Windows machine.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # The release builds with the inspector off, so this does too.
          CGO_ENABLED=0 go build -tags mygo_noinspector -o /dev/null .
