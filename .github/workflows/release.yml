name: Release

# A version tag builds the app for macOS, Windows and Linux, then publishes
# installers and signed update files to a GitHub release of that tag.
# A manual run builds the same artifacts without publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The toolchain the project pins, so a release builds what the tests ran
  # against.
  GO_VERSION: "1.27.1"
  MYGO_VERSION: "v0.6.3"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read the version
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "MYGO_UPDATER_PRIVATE_KEY is required for signed updates" >&2
            exit 1
          fi
          version="$(jq -r .version mygo.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "mygo.json has no version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag release must match the version the build stamps into the
          # app, or the app would offer an update to itself forever.
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) tag="v$version" ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$tag" != "v$version" ]; then
            echo "the tag $tag does not match the version $version in mygo.json" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        # The app's own tests draw the interface with MyGo's headless
        # renderer, so they need no display and no GPU.
        run: CGO_ENABLED=0 go test ./...

  macos:
    needs: [version, test]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the app and the disk image
        env:
          # Optional: a Developer ID signs and notarizes the app, so Gatekeeper
          # lets it run on other Macs. Without one the build is ad hoc signed,
          # which is what a person builds for themselves.
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          # Signs the update archives and the manifests. GH_TOKEN lets the
          # build find the previous release, whose archives are the bases of
          # the delta updates.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Sign with a Developer ID when the repository has one. The
          # certificate arrives as a base64 .p12 and goes in a keychain of
          # its own for the length of the build.
          if [ -n "${MACOS_CERTIFICATE:-}" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password="$(uuidgen)"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
          fi

          identity="${MACOS_SIGNING_IDENTITY:--}"
          args=(-platform darwin/universal -sign "$identity")

          # Notarize only when the notary credentials are here too: an
          # identity without them would fail the build at the last step.
          if [ -n "${MACOS_NOTARY_APPLE_ID:-}" ] && [ -n "${MACOS_NOTARY_PASSWORD:-}" ] && [ "$identity" != "-" ]; then
            xcrun notarytool store-credentials "bucketeer" \
              --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" \
              --password "$MACOS_NOTARY_PASSWORD"
            jq '.macos.notarize = {"keychainProfile": "bucketeer"}' mygo.json > mygo.tmp.json
            mv mygo.tmp.json mygo.json
            args+=(-notarize)
          else
            args+=(-skip-notarize)
          fi

          go run "github.com/egoist/mygo/cmd/mygo@${MYGO_VERSION}" build "${args[@]}"

          # The signing keychain is not needed once the build is done.
          if [ -n "${MACOS_CERTIFICATE:-}" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi

      - name: List what was built
        run: find build -maxdepth 2 -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            build/darwin-*/*.dmg
            build/darwin-*/*.tar.gz
            build/darwin-*/update-*.json
            build/darwin-*/*.delta

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the app and the installer
        shell: pwsh
        env:
          # Optional: a code signing certificate keeps SmartScreen quiet. The
          # password goes in the variable MyGo reads.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Signs the update archives and the manifests; GH_TOKEN is for the
          # delta updates against the previous release.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:WINDOWS_CERTIFICATE) {
            [IO.File]::WriteAllBytes("$PWD\certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $json = Get-Content mygo.json -Raw | ConvertFrom-Json
            $json | Add-Member -NotePropertyName windows `
              -NotePropertyValue @{ certificate = "certificate.pfx" } -Force
            $json | ConvertTo-Json -Depth 10 | Set-Content mygo.json
          }

          # mygo build makes the NSIS installer, downloading NSIS itself when
          # the runner has none.
          go run "github.com/egoist/mygo/cmd/mygo@$env:MYGO_VERSION" build -platform windows/amd64

      - name: List what was built
        shell: pwsh
        run: Get-ChildItem -Recurse build -File | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          # Ship the installer and every update file the manifest references.
          path: |
            build/windows-*/**/*Setup*.exe
            build/windows-*/*.tar.gz
            build/windows-*/update-*.json
            build/windows-*/*.delta

  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # MyGo needs no cgo, so both architectures build here. The tar.gz mygo
      # makes carries the app and an install.sh that installs to ~/.local
      # without root; the Debian package is for apt-based systems.
      - name: Build the app for amd64 and arm64
        env:
          # Signs the update archives and the manifests; GH_TOKEN is for the
          # delta updates against the previous release.
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          go run "github.com/egoist/mygo/cmd/mygo@${MYGO_VERSION}" build \
            -platform linux/amd64,linux/arm64

      - name: List what was built
        run: find build -maxdepth 2 -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          # The packages only: the loose executable, desktop entry and icons
          # the tar.gz already holds are not downloads of their own.
          path: |
            build/linux-*/*.tar.gz
            build/linux-*/*.deb
            build/linux-*/update-*.json
            build/linux-*/*.delta
            build/linux-*/install.sh

  # The smoke test runs each installer's payload the way a user's machine
  # would: the macOS app through `open`, the Windows executable directly with
  # its command line, which must reach storage rather than open a window.
  smoke-macos:
    needs: macos
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts

      - name: Run the packaged app's command line
        run: |
          set -euo pipefail
          # The app ships inside the disk image, which is what was uploaded;
          # mounting it is also what a person does.
          dmg="$(find artifacts -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "no disk image was built" >&2
            ls -R artifacts >&2
            exit 1
          fi
          mount=/tmp/bucketeer-dmg
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          # Whatever the volume holds is the app, whatever the bundle is
          # named, so the check does not hard-code the name.
          bundle="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          bin="$bundle/Contents/MacOS/$(basename "$bundle" .app)"
          test -x "$bin" || bin="$(find "$bundle/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -x "$bin"

          # A clean HOME, so the check exercises a first-run install: no
          # connections, no keychain entries, no settings.
          export HOME="$RUNNER_TEMP/fresh-home"
          mkdir -p "$HOME"

          "$bin" --help | grep -q "the Bucketeer command line"
          # A command with nothing configured explains itself on stderr and
          # exits non-zero, rather than crashing or opening a window.
          if "$bin" profiles >"$RUNNER_TEMP/out" 2>&1; then
            : # a saved connection is fine too; only a crash is not
          fi
          if grep -qi "panic" "$RUNNER_TEMP/out"; then
            echo "the command line panicked with no configuration:" >&2
            cat "$RUNNER_TEMP/out" >&2
            exit 1
          fi
          # The window is never opened here: the binary only builds its
          # interface when started without arguments.
          hdiutil detach "$mount" >/dev/null

  smoke-windows:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - name: Install, then run the installed app's command line
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Recurse artifacts -Filter *Setup*.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer was built" }

          # Install silently, exactly as the installer would for a user, then
          # run what it put on disk. /S is NSIS's silent mode; /D must be the
          # last argument and unquoted.
          $dir = Join-Path $env:RUNNER_TEMP "Bucketeer"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }

          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -ne "Uninstall.exe" } |
            Select-Object -First 1
          if (-not $exe) { throw "the installer put no app in $dir" }
          $out = & $exe.FullName --help 2>&1 | Out-String
          if ($out -notmatch "the Bucketeer command line") {
            throw "the packaged exe did not answer --help: $out"
          }

          # A fresh profile directory, so this is a first-run check: a
          # command with nothing configured must explain itself, not crash.
          $env:BUCKETEER_DATA_DIR = Join-Path $env:RUNNER_TEMP "fresh-data"
          New-Item -ItemType Directory -Force $env:BUCKETEER_DATA_DIR | Out-Null
          $profiles = & $exe.FullName profiles 2>&1 | Out-String
          if ($profiles -match "panic") {
            throw "the command line panicked with no configuration: $profiles"
          }
          Write-Host $profiles

          # Leave the machine as it was.
          $uninstall = Join-Path $dir "Uninstall.exe"
          if (Test-Path $uninstall) {
            Start-Process -FilePath $uninstall -ArgumentList "/S" -Wait
          }

  smoke-linux:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts

      - name: Extract the archive, then run its command line
        run: |
          set -euo pipefail
          # This runner is amd64; the arm64 archive cannot run here.
          tarball="$(find artifacts -name '*linux-amd64.tar.gz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "no amd64 Linux archive was built" >&2
            ls -R artifacts >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/bucketeer"
          mkdir -p "$dir"
          tar -xzf "$tarball" -C "$dir"
          test -x "$dir/bucketeer"

          # A clean data directory, so this is a first-run check: a command
          # with nothing configured must explain itself, not crash.
          export BUCKETEER_DATA_DIR="$RUNNER_TEMP/fresh-data"
          mkdir -p "$BUCKETEER_DATA_DIR"

          "$dir/bucketeer" --help | grep -q "the Bucketeer command line"
          if "$dir/bucketeer" profiles >"$RUNNER_TEMP/out" 2>&1; then
            : # a saved connection is fine too; only a crash is not
          fi
          if grep -qi "panic" "$RUNNER_TEMP/out"; then
            echo "the command line panicked with no configuration:" >&2
            cat "$RUNNER_TEMP/out" >&2
            exit 1
          fi

  publish:
    needs: [version, macos, windows, linux, smoke-macos, smoke-windows, smoke-linux]
    # Only a tag publishes. A manual run stops after the smoke tests, with the
    # artifacts to download.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # GitHub replaces spaces in an asset's name with dots, so the files
          # are renamed to a name that reads well instead: hyphens and the
          # architecture, which is the usual shape of a download.
          dmg="$(find artifacts -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then echo "no disk image" >&2; exit 1; fi
          cp "$dmg" "dist/Bucketeer-$VERSION-macos-universal.dmg"

          setup="$(find artifacts -name '*Setup*.exe' -print -quit)"
          if [ -z "$setup" ]; then echo "no Windows installer" >&2; exit 1; fi
          cp "$setup" "dist/Bucketeer-$VERSION-windows-amd64.exe"

          # The update files keep the exact names the manifests reference:
          # the archives, the deltas from earlier versions, and the
          # manifests last of all (attached after the files they name).
          find artifacts -name 'update-*.json' -exec cp {} dist/ \;
          find artifacts -name '*.delta' -exec cp {} dist/ \;
          find artifacts -name 'bucketeer-*.tar.gz' -exec cp {} dist/ \;

          # Linux uses the lowercase archive name referenced by the updater;
          # GitHub treats uppercase/lowercase aliases as duplicate assets.
          # Debian packages retain the usual download naming.
          while IFS= read -r deb; do
            arch="$(basename "$(dirname "$deb")" | sed 's/.*linux-//')"
            cp "$deb" "dist/Bucketeer-$VERSION-linux-$arch.deb"
          done < <(find artifacts -name '*.deb')
          while IFS= read -r installer; do
            arch="$(basename "$(dirname "$installer")" | sed 's/.*linux-//')"
            cp "$installer" "dist/install-linux-$arch.sh"
          done < <(find artifacts -path '*linux-*' -name install.sh)

          ls -lh dist

      - name: Verify all update manifests have their downloads
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          names = [p.name.casefold() for p in Path("dist").iterdir()]
          assert len(names) == len(set(names)), "Duplicate release asset names ignoring case"
          for target in ("darwin-universal", "windows-amd64", "linux-amd64", "linux-arm64"):
              manifest = Path("dist") / f"update-{target}.json"
              data = json.loads(manifest.read_text())
              assert data["version"] == os.environ["VERSION"], manifest
              for download in [data, *data.get("deltas", [])]:
                  asset = Path("dist") / Path(urlparse(download["url"]).path).name
                  assert asset.is_file(), f"{manifest}: missing {asset}"
                  assert asset.stat().st_size == download["size"], f"{asset}: size mismatch"
                  assert download["signature"], f"{asset}: missing signature"
              print(f"{manifest}: downloads present")
          PY

      - name: Write the release notes
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          # Kept outside dist/, which is what gets attached: notes are not an
          # installer.
          notes="release-notes.md"
          # The changelog's own section, when it has one.
          if [ -f CHANGELOG.md ] && grep -q "^## $version" CHANGELOG.md; then
            awk -v v="## $version" '
              index($0, v) == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > "$notes"
          fi
          {
            echo
            echo "### Downloads"
            echo
            echo "- **macOS** — \`Bucketeer-$version-macos-universal.dmg\` runs on Apple silicon and Intel Macs."
            echo "- **Windows** — \`Bucketeer-$version-windows-amd64.exe\` installs for the current user; no administrator prompt."
            echo '- **Linux** — download the .deb for your architecture, or the .tar.gz plus the matching install-linux-<arch>.sh script for a per-user install in ~/.local.'
            echo
            echo "The app also carries the \`bkt\` command line and a skill for coding agents;"
            echo "install both from **Settings → Command line**."
          } >> "$notes"
          cat "$notes"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A tag pushed again replaces the files, keeping the release.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Bucketeer $VERSION" \
              --notes-file release-notes.md
          fi
          gh release view "$TAG"
